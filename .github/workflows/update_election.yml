   name: Aktualizace volebních výsledků

   on:
     schedule:
       - cron: "*/5 * 9-11 10 *"
     workflow_dispatch:

   permissions:
     contents: write

   concurrency:
     group: update-election
     cancel-in-progress: false

   jobs:
     update:
       runs-on: ubuntu-latest
       timeout-minutes: 30
       steps:
         - name: Stáhnout repozitář
           uses: actions/checkout@v4

         - name: Kontrolovat data každou minutu (25 minut)
           run: |
             git config user.name "github-actions[bot]"
             git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
             for i in $(seq 1 25); do
               python3 election_tracker.py || true
               if [ -f index.html ]; then
                 git add index.html
                 if ! git diff --cached --quiet; then
                   git commit -m "Aktualizace výsledků $(date -u +'%Y-%m-%d %H:%M') UTC"
                   git pull --rebase --quiet || true
                   git push || true
                 fi
               fi
               sleep 60
             done
